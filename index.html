<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quant Paper Reader</title>
<meta name="description" content="Drop in a technical paper and get a plain-language brief, the math explained at three levels, and a plan to replicate it in Python.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunken:#E8ECEA; --ink:#15201C; --ink-2:#4B5853; --ink-3:#77837E; --rule:#D3DAD7;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#DCECEA;
  --math:#5A44A6; --math-soft:#ECE8F7; --field:#8F5C0E; --field-soft:#F5EBD9;
  --good:#2C7A4D; --good-soft:#E0F0E6; --warn:#9C5F0B; --warn-soft:#FAEBD3; --bad:#AE3636; --bad-soft:#F7E0E0;
  --code-bg:#18211E; --code-ink:#E3EBE7;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#161E1B; --sunken:#1D2724; --ink:#E3EAE7; --ink-2:#A7B4AF; --ink-3:#7B8883; --rule:#2A3531;
    --accent:#4DBAB0; --accent-ink:#06201D; --accent-soft:#15302D;
    --math:#B2A1EF; --math-soft:#241F3D; --field:#DEAA58; --field-soft:#31260F;
    --good:#6BC990; --good-soft:#14281C; --warn:#E5A64D; --warn-soft:#32240E; --bad:#EC8888; --bad-soft:#351A1A;
    --code-bg:#0A0F0D; --code-ink:#DBE5E0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#161E1B; --sunken:#1D2724; --ink:#E3EAE7; --ink-2:#A7B4AF; --ink-3:#7B8883; --rule:#2A3531;
  --accent:#4DBAB0; --accent-ink:#06201D; --accent-soft:#15302D;
  --math:#B2A1EF; --math-soft:#241F3D; --field:#DEAA58; --field-soft:#31260F;
  --good:#6BC990; --good-soft:#14281C; --warn:#E5A64D; --warn-soft:#32240E; --bad:#EC8888; --bad-soft:#351A1A;
  --code-bg:#0A0F0D; --code-ink:#DBE5E0;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%}
/* ---------- rail ---------- */
.rail{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.brand h1{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--ink-3);font-size:12px}
.add{padding:14px 18px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
.drop{border:1.5px dashed var(--rule);border-radius:var(--r);padding:14px 12px;text-align:center;background:var(--bg);transition:border-color .15s, background .15s}
.drop.over,body.dragging .drop{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-weight:600;font-size:13px}
.drop span{color:var(--ink-3);font-size:12px}
.row{display:flex;gap:6px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn:disabled{opacity:.45;cursor:default}
.field-input{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:7px 10px;font-size:13px;min-width:0}
.field-input:focus{outline:none;border-color:var(--accent)}
.lib{flex:1;overflow:auto;padding:8px 10px;min-height:0}
.lib-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;display:flex;justify-content:space-between}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:9px 10px;margin-bottom:2px}
.item:hover{background:var(--sunken)}
.item.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.item .t{font-family:var(--serif);font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{display:flex;gap:6px;align-items:center;margin-top:4px;color:var(--ink-3);font-size:11.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.run{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:500;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill.math{background:var(--math-soft);color:var(--math)}
.pill.field{background:var(--field-soft);color:var(--field)}
.pill.beginner{background:var(--good-soft);color:var(--good)}
.pill.intermediate{background:var(--warn-soft);color:var(--warn)}
.pill.advanced{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.foot{border-top:1px solid var(--rule);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.foot .conn{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.foot .conn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- main ---------- */
.main{overflow:auto;min-height:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:28px;padding-block:26px 80px}
.phead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.phead .eyebrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:0}
.phead .toolbar{flex-wrap:nowrap;align-items:flex-start}
.phead .toolbar .btn{flex:none}
.phead h2{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(22px,3vw,28px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.phead .by{color:var(--ink-2);font-size:13.5px}
.phead .src{color:var(--ink-3);font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 9px;font-size:13.5px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{width:6px;height:6px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px}
.h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.lede{font-family:var(--serif);font-size:19px;line-height:1.45;margin:0;text-wrap:pretty}
.prose p{font-family:var(--serif);font-size:16.5px;line-height:1.62;margin:0 0 12px;max-width:68ch}
.prose p:last-child{margin-bottom:0}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{position:relative;padding-left:16px;font-size:14.5px;line-height:1.55;max-width:72ch}
.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--bullet,var(--accent))}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.terms{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 16px;margin:0}
.terms dt{font-weight:600;font-size:13.5px}
.terms dd{margin:0;color:var(--ink-2);font-size:13.5px}
.seg{display:inline-flex;background:var(--sunken);border-radius:7px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:5px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .lbl{font-size:12.5px;color:var(--ink-3)}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;counter-reset:ord}
.order span{font-size:12.5px;border-radius:5px;padding:3px 8px}
.order span::before{counter-increment:ord;content:counter(ord);font-variant-numeric:tabular-nums;opacity:.55;margin-right:6px;font-size:11px}
.order .m{background:var(--math-soft);color:var(--math)}
.order .f{background:var(--field-soft);color:var(--field)}
.concept{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);border-left:3px solid var(--kind,var(--math))}
.concept.f{--kind:var(--field)}
.concept summary{list-style:none;padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.concept summary::-webkit-details-marker{display:none}
.concept summary .nm{font-weight:600;font-size:15px;flex:1}
.concept summary .chev{color:var(--ink-3);transition:transform .15s}
.concept[open] summary .chev{transform:rotate(90deg)}
.concept .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.model{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;margin:0;color:var(--ink)}
.explain{font-size:14.5px;line-height:1.65;margin:0;max-width:72ch}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:6px;padding:10px 12px}
.kv b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.kv p{margin:0;font-size:13.5px;line-height:1.55}
.kv .py p{font-family:var(--mono);font-size:12.5px}
.links{display:flex;flex-direction:column;gap:6px}
.link{display:grid;grid-template-columns:minmax(0,max-content) auto minmax(0,max-content) 1fr;gap:8px;align-items:baseline;font-size:13.5px}
.link .a{font-weight:600}
.link .arr{color:var(--ink-3)}
.link .how{color:var(--ink-2)}
.eq{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.eq .nm{font-weight:600;font-size:15px}
.eq .tex{overflow-x:auto;padding:6px 0;font-size:17px;color:var(--ink)}
.eq .tex mjx-container{margin:0!important}
.eq .raw{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);overflow-x:auto;white-space:pre}
.eq .plain{margin:0;font-family:var(--serif);font-size:16px;line-height:1.55}
.symtab{width:100%;border-collapse:collapse;font-size:13.5px}
.symtab td{padding:5px 8px;border-top:1px solid var(--rule);vertical-align:top}
.symtab td:first-child{width:1%;white-space:nowrap;padding-left:0}
.why{font-size:13.5px;color:var(--ink-2);margin:0}
.pipe{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column}
.pipe li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.pipe li:first-child{border-top:0}
.pipe li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pipe h4{margin:0 0 2px;font-size:14px}
.pipe p{margin:0 0 6px;color:var(--ink-2);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--mono);font-size:11.5px;background:var(--sunken);color:var(--ink-2);border-radius:4px;padding:1px 6px}
.models{display:flex;flex-direction:column;gap:8px}
.models div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.models b{font-weight:600;font-size:13.5px}
.models span.r{color:var(--ink-2);font-size:13px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.phase .n{font-family:var(--serif);font-size:26px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.phase h4{margin:0;font-size:15px}
.phase .dur{color:var(--ink-3);font-size:12.5px}
.tasks{grid-column:2;list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:var(--bg);border-radius:6px}
.tasks .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:13.5px}
.tree{font-family:var(--mono);font-size:12.5px;line-height:1.7;background:var(--bg);border-radius:6px;padding:10px 14px;margin:8px 0 0;overflow-x:auto;white-space:pre}
.ext{display:flex;flex-direction:column;gap:10px}
.ext .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ext h4{margin:0;font-size:15.5px;line-height:1.35}
.ext .badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ext p{margin:0;font-size:14px;line-height:1.6;max-width:72ch}
.ext .how{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13.5px}
.ext .pf{font-size:13px;color:var(--good)}
/* code + chat */
.code{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);margin:0}
.code pre{margin:0;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;max-height:560px}
.code .cp{position:absolute;top:8px;right:8px;background:rgb(255 255 255 / .1);border:0;color:var(--code-ink);border-radius:5px;padding:3px 9px;font-size:11.5px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--bg);cursor:pointer}
.radios input{accent-color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent-soft);border-radius:10px 10px 2px 10px;padding:9px 13px;font-size:14px}
.msg.a{align-self:flex-start;font-size:14.5px;line-height:1.65}
.msg.a p{margin:0 0 10px;max-width:70ch}
.msg.a ul,.msg.a ol{margin:0 0 10px;padding-left:20px}
.msg.a .code{margin:6px 0 12px}
.msg code,.explain code{font-family:var(--mono);font-size:.9em;background:var(--sunken);padding:1px 4px;border-radius:3px}
.composer{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:10px}
.composer textarea{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:14px;resize:vertical;min-height:64px}
.composer textarea:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
/* states */
.pending{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--rule);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14px}
.steps .ok{width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:10px;flex:none}
.steps .wait{width:16px;height:16px;border-radius:50%;border:2px solid var(--rule);flex:none}
.steps .bad{width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:10px;flex:none}
.muted{color:var(--ink-3)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:60px 10px;color:var(--ink-2)}
.empty h2{font-family:var(--serif);font-weight:600;font-size:24px;color:var(--ink);margin:0 0 6px}
/* sheet (settings / paste) */
.sheet{position:fixed;inset:0;background:rgb(10 15 13 / .45);display:grid;place-items:center;z-index:40;padding:16px}
.sheet .panel{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.sheet h3{margin:0;font-family:var(--serif);font-weight:600;font-size:20px}
.sheet label.l{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
.sheet label.l small{font-weight:400;color:var(--ink-3)}
.sheet textarea{min-height:90px;resize:vertical}
.connect{max-width:560px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.connect h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0}
.connect p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.6}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  html,body{height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .lib{max-height:220px}
  .main{overflow:visible}
  .wrap{padding-inline:16px;padding-block:18px 60px}
  .tabs{top:env(safe-area-inset-top,0px)}
  .terms{grid-template-columns:1fr}
  .terms dd{margin-bottom:6px}
  .link{grid-template-columns:1fr;gap:0}
  .link .arr{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" aria-label="Library">
    <div class="brand">
      <h1>Quant Paper Reader</h1>
      <p>Papers in, understanding out.</p>
    </div>
    <div class="add" id="add"></div>
    <div class="lib" id="lib"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div id="overlay"></div>

<script>
window.MathJax = {
  tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
  svg: { fontCache: "global" },
  options: { ignoreHtmlClass: "no-math" },
  startup: {
    typeset: false,
    ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => window.__typesetMain && window.__typesetMain()); }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" async></script>

<script>
/* =====================================================================
   Quant Paper Reader
   Runs two ways from one file:
   - inside Claude (published artifact): uses the viewer's Claude account via
     the artifact "sample" capability. No API key.
   - anywhere else (GitHub Pages, a local file): the visitor pastes their own
     Anthropic API key once; it is kept in this browser only.
   ===================================================================== */
"use strict";

const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
const API_URL = "https://api.anthropic.com/v1/messages";
const MODELS = [
  { id: "claude-sonnet-5", label: "Claude Sonnet 5 (recommended)" },
  { id: "claude-opus-5-5", label: "Claude Opus 5.5 (deepest, slower)" },
  { id: "claude-haiku-4-5-20251001", label: "Claude Haiku 4.5 (fastest)" },
];
const LS_LIB = "qpr.library.v1", LS_SET = "qpr.settings.v1";
const STORE_TEXT_BYTES = 60000;     // paper text kept per paper
const SAMPLE_MAX_BYTES = 65536;     // artifact sample() input cap
const DEFAULT_ABOUT = "A graduate student in economics and applied math. Comfortable with calculus, linear algebra and probability; newer to Python. Interested in quantitative finance and energy and commodity markets.";

/* ---------------------------- utilities ---------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const arr = v => Array.isArray(v) ? v : (typeof v === "string" && v.trim() ? [v] : []);
const str = v => (v == null ? "" : String(v));
const bytes = s => new TextEncoder().encode(s).length;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); if (btn) { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1500); } }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}

/* Cut a string so its UTF-8 size fits `max` bytes. */
function cutBytes(s, max) {
  if (bytes(s) <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (bytes(s.slice(0, mid)) <= max) lo = mid; else hi = mid - 1; }
  return s.slice(0, lo);
}
function cutBytesEnd(s, max) {
  if (bytes(s) <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (bytes(s.slice(s.length - mid)) <= max) lo = mid; else hi = mid - 1; }
  return s.slice(s.length - lo);
}

/* Clean extracted PDF text; drop the reference list. */
function cleanPaperText(raw) {
  let t = raw.replace(/\r/g, "").replace(/(\w)-\n(?=[a-z])/g, "$1").replace(/[ \t\f\v]+/g, " ").replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  let droppedRefs = false;
  const re = /\n\s*(references|bibliography|literature cited|works cited)\s*\n/gi;
  let m, last = -1;
  while ((m = re.exec(t))) last = m.index;
  if (last > t.length * 0.45) { t = t.slice(0, last).trim(); droppedRefs = true; }
  return { text: t, droppedRefs };
}
/* Fit paper text into a byte budget: keep the start (abstract, intro, method) and the end (results, conclusion). */
function fitText(text, budget) {
  if (bytes(text) <= budget) return { text, trimmed: false };
  const marker = "\n\n[... part of the middle of the paper was omitted to fit ...]\n\n";
  const room = budget - bytes(marker);
  const head = cutBytes(text, Math.floor(room * 0.72));
  const tail = cutBytesEnd(text, room - bytes(head));
  return { text: head + marker + tail, trimmed: true };
}

/* Make model JSON parse even when LaTeX backslashes were not doubled. */
function repairEscapes(s) {
  return s.replace(/\\(\\|u[0-9a-fA-F]{4}|[\s\S])(?=([\s\S]?))/g, (m, c, next) => {
    if (c === "\\" || c.length === 5 || c === '"' || c === "/") return m;
    if ("bfnrt".includes(c) && !/[a-z]/.test(next)) return m;
    return "\\\\" + c;
  });
}
function parseModelJSON(text) {
  let t = str(text).trim().replace(/^```[a-zA-Z]*\s*/, "").replace(/\s*```\s*$/, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b <= a) throw { code: "bad_json", message: "No JSON object in the answer" };
  t = t.slice(a, b + 1);
  const attempts = [t, repairEscapes(t), repairEscapes(t).replace(/,\s*([}\]])/g, "$1")];
  for (const x of attempts) { try { return JSON.parse(x); } catch {} }
  throw { code: "bad_json", message: "The answer was not valid JSON" };
}

/* Tiny safe markdown for chat and code answers. */
function md(text) {
  const parts = str(text).split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
  let html = "";
  for (let i = 0; i < parts.length; i += 3) {
    html += mdBlocks(parts[i]);
    if (i + 2 < parts.length) html += codeBlock(parts[i + 2]);
  }
  return html;
}
function mdInline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function mdBlocks(s) {
  return s.split(/\n{2,}/).map(block => {
    const lines = block.split("\n").filter(l => l.trim());
    if (!lines.length) return "";
    if (lines.every(l => /^\s*[-*]\s+/.test(l))) return "<ul>" + lines.map(l => "<li>" + mdInline(l.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>";
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) return "<ol>" + lines.map(l => "<li>" + mdInline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
    if (/^#{1,4}\s/.test(lines[0])) return "<p><strong>" + mdInline(lines[0].replace(/^#+\s*/, "")) + "</strong>" + (lines.length > 1 ? "<br>" + lines.slice(1).map(mdInline).join("<br>") : "") + "</p>";
    return "<p>" + lines.map(mdInline).join("<br>") + "</p>";
  }).join("");
}
function codeBlock(code) {
  return `<div class="code no-math"><button class="cp" data-act="copy-code">Copy</button><pre><code>${esc(code.replace(/\n$/, ""))}</code></pre></div>`;
}

/* ---------------------------- state ---------------------------- */
const S = {
  mode: null,              // "claude" | "api"
  sample: null, downloads: null, sampleMax: SAMPLE_MAX_BYTES,
  settings: Object.assign({ about: DEFAULT_ABOUT, model: MODELS[0].id, apiKey: "", depth: "simple" }, lsGet(LS_SET, {})),
  papers: [], currentId: null, tab: "brief",
  jobs: {},                // paperId -> { A|B|C|code|chat : {ctl, t0} }
  chats: {},               // paperId|"__lib" -> [{role, text}]
  pdfData: {},             // paperId -> base64 (memory only, API mode)
  scope: "paper", sheet: null, connectError: "",
};
const cur = () => S.papers.find(p => p.id === S.currentId) || null;
function saveSettings() { lsSet(LS_SET, S.settings); }
function saveLibrary() {
  const slim = S.papers.map(p => ({ ...p }));
  if (lsSet(LS_LIB, slim)) return;
  // Out of space: drop stored text from the oldest papers until it fits.
  for (let i = 0; i < slim.length; i++) { slim[i] = { ...slim[i], text: "" }; if (lsSet(LS_LIB, slim)) { toast("Browser storage is full. Older papers keep their analysis but not their text."); return; } }
  toast("Browser storage is full; this library won't be saved after you close the page.");
}

/* ---------------------------- Claude access ---------------------------- */
async function detectMode() {
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const s = await window.claude.use("sample");
      if (s) {
        S.mode = "claude"; S.sample = s;
        try { const lim = await s.limits(); if (lim && lim.maxPromptBytes) S.sampleMax = lim.maxPromptBytes; } catch {}

}
const FATAL = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "session_expired", "bad_key"]);
function friendly(e) {
  const c = e && e.code;
  const map = {
    cancelled: "Stopped.",
    not_granted: "Claude access was declined for this page. Reload the page to be asked again.",
    sampling_disabled: "Claude isn't available to this page for your account.",
    not_declared: "This page can't reach Claude. Republish it with Claude access turned on.",
    capability_disabled: "Claude isn't available in this view.",
    capability_removed: "Claude isn't available in this view.",
    session_expired: "Your Claude session expired. Sign in again, then retry.",
    rate_limited: "You've hit a usage limit. Wait a little, then retry.",
    prompt_too_large: "This request was too long. Try pasting only the main sections of the paper.",
    refused: "Claude declined to answer this request.",
    empty_completion: "Claude returned an empty answer. Retry.",
    bad_json: "The answer came back in a broken format. Retry this section.",
    truncated: "The answer was cut off before it finished. Retry this section.",
    bad_key: "The API key was rejected. Check it in Settings.",
    network: "Couldn't reach Anthropic. Check your connection and retry.",
    bad_request: (e && e.message) ? "Anthropic rejected the request: " + e.message : "Anthropic rejected the request.",
    overloaded: "Claude is busy right now. Retry in a minute.",

/* One entry point for every model call.
   opts: { paper, prompt | turns, onText, signal, cache, maxTokens, attach } */
async function callClaude(opts) {
  if (S.mode === "claude") {
    const input = opts.turns ? opts.turns.map(t => ({ role: t.role, content: t.content })) : opts.prompt;
    const o = { signal: opts.signal };
    if (opts.onText) o.onText = opts.onText;
    if (opts.cache === false) o.cache = false;
    try { return await S.sample(input, o); }
    catch (e) { throw { code: (e && e.code) || "upstream_error", message: e && e.message, text: e && e.text }; }
  }
  return apiCall(opts);
}
function docBlock(paper) {
  if (!paper) return null;
  if (S.pdfData[paper.id]) return { type: "document", source: { type: "base64", media_type: "application/pdf", data: S.pdfData[paper.id] }, cache_control: { type: "ephemeral" } };
  if (paper.source && paper.source.kind === "url") return { type: "document", source: { type: "url", url: paper.source.url }, cache_control: { type: "ephemeral" } };
  return null;
}
async function apiCall(opts) {

  const doc = opts.attach ? docBlock(opts.paper) : null;
  let messages;
  if (opts.turns) {
    messages = opts.turns.map((t, i) => ({ role: t.role, content: (i === 0 && doc) ? [doc, { type: "text", text: t.content }] : t.content }));
  } else {
    messages = [{ role: "user", content: doc ? [doc, { type: "text", text: opts.prompt }] : opts.prompt }];
  }
  let res;
  try {
    res = await fetch(API_URL, {
      method: "POST", signal: opts.signal,
      headers: { "content-type": "application/json", "x-api-key": S.settings.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: S.settings.model, max_tokens: opts.maxTokens || 8000, stream: true, messages }),
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw { code: "cancelled" };
    throw { code: "network", message: e && e.message };
  }
  if (!res.ok) {
    let j = null; try { j = await res.json(); } catch {}
    const m = j && j.error && j.error.message;
    if (res.status === 401 || res.status === 403) throw { code: "bad_key", message: m };
    if (res.status === 429) throw { code: "rate_limited", message: m };
    if (res.status === 529 || res.status >= 500) throw { code: "overloaded", message: m };
    throw { code: "bad_request", message: m || ("HTTP " + res.status) };

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", truncated = false;
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const evt = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of evt.split("\n")) {

          let d; try { d = JSON.parse(line.slice(5).trim()); } catch { continue; }

    throw e && e.code ? e : { code: "network", message: e && e.message, text };

/* ---------------------------- prompts ---------------------------- */
function reader() { return str(S.settings.about).trim() || DEFAULT_ABOUT; }
const JSON_RULES = `Reply with exactly one JSON object and nothing else: no code fences, no comments. Inside JSON strings, double every LaTeX backslash (write \\\\frac, \\\\sigma, \\\\( x \\\\)) so the JSON stays valid. Write inline math inside \\\\( ... \\\\). Never use $ for math.`;
function intro(paper, withText) {
  return `You help a reader understand a technical paper (quantitative finance, economics, applied math, statistics or machine learning).
About the reader: ${reader()}
Base every statement on the paper. When the paper does not state something, say "Not stated in the paper" rather than guessing. Write plainly and directly.` + (withText ? "" : "\nThe paper is attached as a PDF.");
}
const PART_SPECS = {
  A: {
    label: "brief", max: 8000,
    ask: `TASK: Write the brief. Return this JSON shape:
{"title":"","authors":"","year":"","venue":"journal or preprint server","field":"2-4 word field name",
"tags":["3-6 short topic tags"],
"tldr":"one sentence a smart non-specialist understands",
"summary":["3 short paragraphs: the problem, the approach, the result"],
"key_terms":[{"term":"","meaning":"one plain sentence"}],
"equations":[{"name":"","latex":"LaTeX without delimiters","plain_english":"what it says in words","terms":[{"symbol":"LaTeX","meaning":""}],"why_it_matters":""}],
"findings":["4-6 main results"],
"implications":["3-5 things this means in practice; tie to markets or trading when the paper allows"],
"limitations":["3-5 limits or assumptions that could break"],
"narrative":["3-4 paragraphs telling the story of the paper: what problem motivated it, the key idea, how the pieces fit, why it matters"]}
Give 5-10 key_terms and the 3-6 equations that carry the paper, copied faithfully (fix obvious extraction damage).`,
  },
  B: {
    label: "concepts", max: 12000,
    ask: `TASK: Explain the concepts the reader needs. Return this JSON shape:
{"field_label":"2-4 words naming the applied side, e.g. Economics & markets, Machine learning, Energy markets",
"math":[{"name":"","area":"probability | stochastic calculus | statistics | linear algebra | optimization | numerical methods | other",
"simple":"2-3 sentences with an everyday analogy, no jargon",
"undergrad":"3-5 sentences at upper-undergraduate level",
"rigorous":"4-6 precise sentences with the key definitions or theorems",
"mental_model":"one vivid image",
"why_here":"what this concept does in THIS paper",
"pitfall":"a common mistake",
"python":"which library or function you would use and how"}],
"field":[{"name":"","area":"short area name",
"simple":"","undergrad":"","rigorous":"",
"mental_model":"","why_here":"",
"example":"a real-world case or market event",
"in_data":"what it looks like in data or on a chart"}],
"reading_order":["every concept name above, most foundational first"],
"connections":[{"from":"concept name","to":"concept name","how":"one sentence"}]}
Give 4-7 math concepts, 3-5 field concepts and 4-8 connections. Names in reading_order and connections must match the concept names exactly.`,
  },
  C: {
    label: "plan", max: 8000,
    ask: `TASK: Plan how the reader can replicate and extend this paper in Python. Return this JSON shape:
{"data":{"sources":["data the paper uses, or Not stated in the paper"],"period":"","how_to_get":"where the reader can get equivalent public data"},
"models":[{"name":"","role":"what it does in the paper","difficulty":"beginner | intermediate | advanced"}],
"pipeline":[{"name":"","what":"1-2 sentences","python":["libraries"]}],
"prerequisites":["Python and math skills needed first"],
"weeks":4,
"phases":[{"name":"","duration":"e.g. 1 week","tasks":[{"task":"","skills":["python skills"],"difficulty":"beginner | intermediate | advanced"}]}],
"extensions":[{"idea":"","why":"why it improves on the paper","how":"how to do it in Python","impact":"low | medium | high","difficulty":"beginner | intermediate | advanced","portfolio":"why it strengthens a quant GitHub portfolio"}],
"repo":{"name":"kebab-case-name","description":"one line","structure":["folder/file paths"]}}
Give 4-7 pipeline steps, 3-4 phases, 4-6 extensions. Be realistic about time for a part-time learner.`,
  },
};
function buildPartPrompt(part, paper) {
  const withText = !(S.mode === "api" && docBlock(paper));
  const head = intro(paper, withText) + "\n\n" + PART_SPECS[part].ask + "\n\n" + JSON_RULES;
  if (!withText) return head;
  return withPaperText(head, paper);
}
function withPaperText(head, paper, reserve = 0) {
  if (!str(paper.text).trim()) return head + "\n\n(The full paper text isn't available here. Work from the analysis above and what you know of the paper.)";
  const open = "\n\nPAPER TEXT (extracted from a PDF; equations may be garbled, so reconstruct them from context):\n<<<\n", close = "\n>>>";
  const budget = S.mode === "claude" ? S.sampleMax - bytes(head) - bytes(open) - bytes(close) - reserve - 600 : 150000;
  const fit = fitText(str(paper.text), Math.max(2000, budget));
  return head + open + fit.text + close;

/* ---------------------------- analysis jobs ---------------------------- */
function job(paper) { return S.jobs[paper.id] || (S.jobs[paper.id] = {}); }
function isRunning(paper, key) { return !!(S.jobs[paper.id] && S.jobs[paper.id][key]); }

function validatePart(part, o) {

  if (part === "A" && !str(o.title) && !arr(o.summary).length) throw { code: "bad_json", message: "missing title and summary" };
  if (part === "B" && !arr(o.math).length && !arr(o.field).length) throw { code: "bad_json", message: "no concepts" };
  if (part === "C" && !arr(o.pipeline).length && !arr(o.phases).length) throw { code: "bad_json", message: "no plan" };
  if (part === "A" && typeof o.summary === "string") o.summary = [o.summary];
  if (part === "A" && typeof o.narrative === "string") o.narrative = o.narrative.split(/\n{2,}/);
  return o;
}
async function runPart(paper, part) {
  if (isRunning(paper, part)) return;
  const ctl = new AbortController();
  job(paper)[part] = { ctl, t0: Date.now(), chars: 0 };
  paper.errors = paper.errors || {}; paper.errors[part] = null;
  render();
  try {
    const spec = PART_SPECS[part];
    const r = await callClaude({
      paper, prompt: buildPartPrompt(part, paper), attach: true, signal: ctl.signal, maxTokens: spec.max,
      onText: ({ text }) => { const j = job(paper)[part]; if (j) { j.chars = text.length; const el = document.querySelector(`[data-chars="${paper.id}-${part}"]`); if (el) el.textContent = text.length.toLocaleString(); } },
    });
    let obj;
    try { obj = validatePart(part, parseModelJSON(r.text)); }
    catch (e) { throw r.truncated ? { code: "truncated" } : e; }
    paper.parts[part] = obj;
    saveLibrary();
  } catch (e) {
    paper.errors[part] = { code: e && e.code, msg: friendly(e) };
  } finally {

    render();
  }
}
async function analyze(paper) {
  await runPart(paper, "A");
  const e = paper.errors && paper.errors.A;
  if (e && (FATAL.has(e.code) || e.code === "cancelled")) return;
  await Promise.all([runPart(paper, "B"), runPart(paper, "C")]);
}
function stopPaper(paper) { const j = S.jobs[paper.id]; if (j) Object.values(j).forEach(x => x.ctl && x.ctl.abort()); }

/* ---------------------------- adding papers ---------------------------- */
async function waitFor(check, ms = 12000) {
  const t0 = Date.now();
  while (!check()) { if (Date.now() - t0 > ms) return false; await new Promise(r => setTimeout(r, 100)); }
  return true;
}
async function pdfToText(buf) {
  if (!(await waitFor(() => window.pdfjsLib))) throw { code: "pdfjs", message: "The PDF reader didn't load. Check your connection, or use Paste text." };
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  let out = "";
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    for (const it of tc.items) { out += it.str; out += it.hasEOL ? "\n" : " "; }
    out += "\n\n";
  }
  return { text: out, pages: doc.numPages };
}
function b64FromBuf(buf) {

  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function newPaper(source, text, info) {
  const p = { id: uid(), addedAt: Date.now(), source, text, textInfo: info, parts: { A: null, B: null, C: null }, errors: {}, code: null };
  S.papers.unshift(p); S.currentId = p.id; S.tab = "brief"; saveLibrary(); return p;
}
function makeInfo(rawLen, cleaned, pages) {
  const stored = fitText(cleaned.text, STORE_TEXT_BYTES);
  return { text: stored.text, info: { pages, chars: rawLen, kept: stored.text.length, droppedRefs: cleaned.droppedRefs, trimmed: stored.trimmed } };
}
async function addPdfFile(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") { toast("That isn't a PDF. Use Paste text for other formats."); return; }
  if (S.mode === "api" && !S.settings.apiKey) { S.sheet = "settings"; renderSheet(); toast("Add your API key first."); return; }
  toast("Reading " + file.name + "…");
  try {
    const buf = await file.arrayBuffer();
    const { text, pages } = await pdfToText(buf.slice(0));
    const cleaned = cleanPaperText(text);
    if (cleaned.text.length < 400 && S.mode === "claude") { toast("This PDF has almost no text layer (it may be scanned). Use Paste text instead."); return; }
    const { text: kept, info } = makeInfo(text.length, cleaned, pages);

const CODE_OPTS = {

async function writeCode(paper, opt) {

  render();
  const brief = paper.parts.A ? { title: paper.parts.A.title, equations: paper.parts.A.equations, findings: paper.parts.A.findings } : {};
  const plan = paper.parts.C ? { pipeline: paper.parts.C.pipeline, models: paper.parts.C.models } : {};
  const head = intro(paper, !(S.mode === "api" && docBlock(paper))) + `

TASK: Write one runnable Python script that replicates the core method of this paper so the reader can learn by running it.
Data: ${CODE_OPTS[opt]}
Rules: use numpy, pandas, scipy, matplotlib (and yfinance only if the data option asks for it). Start with a docstring naming the paper and the equations it implements. Comment each block with the matching equation or section of the paper. Keep it under 160 lines and make it run top to bottom with python script.py. Print a short summary of results and save one figure to results.png.
Reply with the script in a single \`\`\`python block, then 3 short bullet points on what to try next. No other text.

WHAT WE ALREADY EXTRACTED:
${JSON.stringify({ brief, plan }).slice(0, 12000)}`;
  const prompt = (S.mode === "api" && docBlock(paper)) ? head : withPaperText(head, paper);
  try {
    const r = await callClaude({
      paper, prompt, attach: true, signal: ctl.signal, cache: false, maxTokens: 6000,
      onText: ({ text }) => { paper.code.text = text; const el = document.getElementById("code-live"); if (el) el.innerHTML = md(text); },
    });

    saveLibrary();

  }
}
function extractPython(text) { const m = str(text).match(/```(?:python|py)?\n([\s\S]*?)```/); return m ? m[1] : ""; }
async function savePython(paper) {

  if (S.mode === "claude") {

async function ask(paper, question) {
  const key = chatKey(paper), lib = key === "__lib";

  const hist = S.chats[key] || (S.chats[key] = []);
  hist.push({ role: "user", text: question.trim() });
  hist.push({ role: "assistant", text: "", live: true });
  const ctl = new AbortController();
  (S.jobs[key] = S.jobs[key] || {}).chat = { ctl };
  renderChat();
  let instr = `You are a patient tutor. About the reader: ${reader()}
Answer in 2-5 short paragraphs. Give the intuition first, then the formal version. Put math inside \\( ... \\) (inline) or \\[ ... \\] (display); never use $. For Python, give short runnable code in \`\`\`python blocks. Tie ideas to real markets when it helps. If the answer isn't supported by the material below, say so.`;
  let attach = false;
  if (lib) {
    instr += "\n\nTHE READER'S LIBRARY (analysis of each paper):\n" + JSON.stringify(S.papers.filter(p => p.parts.A).map(paperDigest)).slice(0, 40000) + "\nCite papers by title.";
  } else {

    else if (paper.text) {
      const past = hist.slice(0, -2).slice(-8);
      const reserve = bytes(past.map(t => t.text).join("")) + bytes(question) + 2000;
      instr = withPaperText(instr, paper, reserve);
    }
  }
  const past = hist.slice(0, -2).slice(-8).map(t => ({ role: t.role, content: t.text || "(no answer)" }));
  const turns = [{ role: "user", content: instr }, ...past, { role: "user", content: question.trim() }];
  const live = hist[hist.length - 1];
  try {
    const r = await callClaude({
      paper, turns, attach, signal: ctl.signal, cache: false, maxTokens: 2500,
      onText: ({ text }) => { live.text = text; const el = document.getElementById("live-msg"); if (el) el.innerHTML = md(text); },

}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "close-sheet" && e.target.closest("[data-stop]") && t.classList.contains("sheet")) return;
  const act = t.dataset.act, p = cur();
  switch (act) {
    case "pick": $("#file").click(); break;
    case "paste": S.sheet = "paste"; renderSheet(); setTimeout(() => $("#paste-text") && $("#paste-text").focus(), 30); break;
    case "settings": S.sheet = "settings"; S.confirmClear = false; renderSheet(); break;
    case "close-sheet": S.sheet = null; renderSheet(); break;
    case "clear-lib":
      if (!S.confirmClear) { S.confirmClear = true; renderSheet(); break; }
      S.papers.forEach(stopPaper); S.papers = []; S.currentId = null; S.chats = {}; S.confirmClear = false; saveLibrary(); S.sheet = null; render(); toast("Library cleared"); break;
    case "open": S.currentId = t.dataset.id; if (!cur().parts.A && S.tab !== "ask") S.tab = "brief"; render(); if (window.matchMedia("(max-width:820px)").matches) $("#main").scrollIntoView({ behavior: "smooth" }); break;
    case "tab": S.tab = t.dataset.tab; S.confirmRemove = null; renderMain(); break;
    case "depth": S.settings.depth = t.dataset.depth; saveSettings(); renderMain(); break;
    case "retry": if (p) { const part = t.dataset.part; if (part === "A") analyze(p); else runPart(p, part); } break;
    case "stop": if (p) stopPaper(p); break;
    case "code": if (p) { const r = document.querySelector('input[name="codeopt"]:checked'); writeCode(p, r ? r.value : "synthetic"); } break;
    case "stop-code": if (p && job(p).code) job(p).code.ctl.abort(); break;
    case "save-py": if (p) savePython(p); break;
    case "copy-code": { const code = t.parentElement.querySelector("code"); copyText(code ? code.textContent : "", t); break; }
    case "scope": S.scope = t.dataset.scope; renderMain(); break;
    case "suggest": { const ta = $("#ask-in"); if (ta) { ta.value = t.textContent; ta.focus(); } break; }
    case "remove":
      if (!p) break;
      if (S.confirmRemove !== p.id) { S.confirmRemove = p.id; renderMain(); break; }
      stopPaper(p); S.papers = S.papers.filter(x => x.id !== p.id); delete S.chats[p.id]; delete S.pdfData[p.id];
      S.confirmRemove = null; S.currentId = S.papers[0] ? S.papers[0].id : null; S.tab = "brief"; saveLibrary(); render(); toast("Paper removed"); break;
  }
});
